[project]
name = "mpt-tool"
version = "0.0.0"
description = "Migration tool for extensions"
authors = [{ name = "SoftwareOne AG" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = {text = "Apache-2.0 license"}

dependencies = [
  "mpt-api-client==6.4.*",
  "pyairtable==3.4.*",
  # Capped at 0.26 because extensions install mpt-tool alongside
  # mpt-extension-sdk, whose mrok dependency requires typer <0.27. A newer typer
  # here makes the extension resolution unsatisfiable.
  "typer==0.26.*",
]

[project.scripts]
mpt-service-cli = "mpt_tool.cli:main"

[dependency-groups]
dev = [
  "flake8==7.3.*",
  "flake8-aaa==0.17.*",
  "flake8-pyproject==1.2.*",
  "freezegun==1.5.*",
  "ipdb==0.13.*",
  "ipython==9.*",
  "mypy==2.3.*",
  "pre-commit==4.6.*",
  "pytest==9.1.*",
  "pytest-cov==7.1.*",
  "pytest-deadfixtures==3.1.*",
  "pytest-mock==3.15.*",
  "ruff==0.16.*",
  "types-requests==2.33.*",
  "wemake-python-styleguide==1.8.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "mpt_tool/**"
]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = "."
addopts = "--cov=mpt_tool --cov-report=term-missing --cov-report=xml --import-mode=importlib"
log_cli = false
filterwarnings = []

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
]
omit = [
    "*/__init__.py"
]

[tool.flake8]
allowed-domain-names = ["data", "result"]
allowed-module-metadata = ["__all__"]
aaa_act_block_style = "large"
doctests = true
extend-ignore = ["WPS226", "WPS412"]
extend-exclude = [
  ".coverage",
  ".github",
  ".idea",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "uv.lock",
  ".venv",
  "migrations/"
]
format = "wemake"
max-imports = 17
max-line-length = 100
select = ["AAA", "E999", "WPS"]
show-source = true
statistics = false
per-file-ignores = [
  "tests/*: WPS202",
]

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
target-version = "py312"
output-format = "full"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simpify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "debugger", # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "stdlib-module-shadowing",   # allow to shadow stdlib and builtin module names
    "raise-without-from-inside-except",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "missing-trailing-comma", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "undocumented-public-module",
    "undocumented-public-package",
    "undocumented-magic-method", # docstring for magic methods
    "undocumented-public-nested-class",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "non-imperative-mood",
    "docstring-starts-with-this",
    "non-capitalized-section-name",
    "single-line-implicit-string-concatenation",  # implicit string concat conflicts with `ruff format`
    "explicit-string-concatenation",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "magic-value-comparison", # do not report magic numbers
    "no-self-use", # do not require classmethod / staticmethod when self not used
    "pytest-raises-too-broad", # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
    "raise-vanilla-args",  # long exception messages from `tryceratops`
]
external = [ "AAA", "WPS" ]

# Plugin configs:
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["ast", "datetime"]
aliases = { datetime = "dt" }

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "undocumented-public-class", # missing docstring in public class
  "undocumented-public-method", # missing docstring in public method
  "undocumented-public-function", # missing docstring in a public function
  "assert", # asserts
  "hardcoded-password-string", # hardcoded passwords
  "suspicious-subprocess-import", # subprocess calls are for tests
  "subprocess-without-shell-equals-true", # do not require `shell=True`
  "start-process-with-partial-path", # partial executable paths
  "pytest-fixture-autouse", # autouse fixtures are an accepted pattern in tests
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "mutable-override",
  "unimported-reveal",
  "deprecated",
]
exclude = ["tests"]
exclude_gitignore = true
ignore_missing_imports = true
local_partial_types = true
strict = true
warn_unreachable = true
